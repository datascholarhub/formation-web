<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="demo.css">
    <link href="
https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css
" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-div">
            <div class="logo">O</div>
            <p>Loop<span>AI</span></p>
        </div>
        <nav>
            <ul>
                <li class="active"><a href="#">Overview</a></li>
                <li><a href="#">Clients</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Inbox</a></li>
                <li><a href="#">Analytics</a></li>
            </ul>
        </nav>
        <div class="quick-actions">
            <p><i class="bi bi-gear"></i></p>
            <p><i class="bi bi-bell"></i></p>
            <div class="profile-picture">
                <img src="https://randomuser.me/api/portraits/men/35.jpg" alt="Profile picture">
                <div class="online-dot"></div>
            </div>
        </div>
    </header>
</body>
</html>
